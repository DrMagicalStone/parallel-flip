<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">

  <!-- 背景 -->
  <rect x="0" y="0" width="400" height="400" fill="white"/>

  <!-- 中心菱形 -->
  <!-- 顶点：上(200,80) 右(320,200) 下(200,320) 左(80,200) -->
  <polygon points="200,80 320,200 200,320 80,200"
           fill="none" stroke="black" stroke-width="2"/>

  <!-- 垂直对角线 -->
  <line x1="200" y1="80" x2="200" y2="320"
        stroke="black" stroke-width="2"/>

  <text x="200" y="65" text-anchor="1st vertex" font-size="16">A</text>
  <text x="65" y="205" text-anchor="2nd vertex" font-size="16">B</text>
  <text x="200" y="345" text-anchor="3rd vertex" font-size="16">C</text>
  <text x="335" y="205" text-anchor="4th vertex" font-size="16">D</text>

  <!-- 外围的四个四边形 -->
  <line x1="200" y1="80" x2="60" y2="60"
        stroke="black" stroke-width="2"/>
  <line x1="60" y1="60" x2="80" y2="200"
        stroke="black" stroke-width="2"/>
  <text x="80" y="88" text-anchor="quadrilateral" font-size="16">1</text>

  <line x1="80" y1="200" x2="60" y2="340"
        stroke="black" stroke-width="2"/>
  <line x1="60" y1="340" x2="200" y2="320"
        stroke="black" stroke-width="2"/>
  <text x="80" y="320" text-anchor="quadrilateral" font-size="16">2</text>

  <line x1="200" y1="320" x2="340" y2="340"
        stroke="black" stroke-width="2"/>
  <line x1="340" y1="340" x2="320" y2="200"
        stroke="black" stroke-width="2"/>
  <text x="312" y="320" text-anchor="quadrilateral" font-size="16">3</text>

  <line x1="320" y1="200" x2="340" y2="60"
        stroke="black" stroke-width="2"/>
  <line x1="340" y1="60" x2="200" y2="80"
        stroke="black" stroke-width="2"/>
  <text x="312" y="88" text-anchor="quadrilateral" font-size="16">4</text>

</svg>